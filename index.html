<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Reeba ❤️</title>
<style>
  :root { --ink:#51483f; --muted:#82776d; --petal:#d9a7ad; --cream:#fffaf4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(ellipse at 20% 15%,#f6e8df 0,transparent 40%),radial-gradient(ellipse at 85% 80%,#e8e8d8 0,transparent 38%),var(--cream); font-family:Georgia,'Times New Roman',serif; }
  .grain { position:fixed; inset:0; pointer-events:none; opacity:.13; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E"); }
  main { position:relative; width:min(90vw,620px); padding:clamp(2.2rem,7vw,4.5rem) 1.5rem; text-align:center; animation:arrive 1.2s ease both; }
  .eyebrow { font: .72rem/1.4 Arial,sans-serif; letter-spacing:.27em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:clamp(2.6rem,9vw,5rem); font-weight:400; letter-spacing:-.045em; line-height:1.05; margin:1.15rem 0 .85rem; }
  h1 em { color:#b77983; font-weight:400; }
  .rule { width:54px; height:1px; background:#c9a39b; margin:1.7rem auto; }
  .message { font-size:clamp(1.15rem,3.5vw,1.55rem); line-height:1.7; margin:0 auto; max-width:440px; }
  .small { margin-top:1.2rem; font: .85rem/1.7 Arial,sans-serif; letter-spacing:.025em; color:var(--muted); }
  .flower { position:fixed; width:clamp(85px,17vw,155px); opacity:.76; animation:sway 7s ease-in-out infinite; transform-origin:50% 85%; }
  .flower.top { top:3vh; left:4vw; transform:rotate(-13deg); }
  .flower.bottom { bottom:2vh; right:4vw; transform:rotate(18deg); animation-delay:-3s; }
  .sprig { position:fixed; width:clamp(45px,8vw,80px); opacity:.5; }
  .sprig.left { bottom:13vh; left:12vw; transform:rotate(-28deg); }
  .sprig.right { top:13vh; right:12vw; transform:rotate(155deg); }
  button { margin-top:2rem; border:1px solid #c9a39b; color:#66534d; background:rgba(255,255,255,.42); padding:.8rem 1.25rem; border-radius:99px; font: .78rem Arial,sans-serif; letter-spacing:.08em; cursor:pointer; transition:background .25s,transform .25s; }
  button:hover { background:#f4e7e1; transform:translateY(-2px); }
  #note { margin-top:1rem; min-height:1.5rem; color:#9a6b70; font-style:italic; opacity:0; transition:opacity .5s; }
  #note.show { opacity:1; }
  @keyframes arrive { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes sway { 0%,100% { translate:0 0; rotate:-2deg; } 50% { translate:0 -7px; rotate:2deg; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div class="grain"></div>
<svg class="flower top" viewBox="0 0 160 190" aria-hidden="true">
 <path d="M80 184 Q83 120 78 68" fill="none" stroke="#71866a" stroke-width="3"/><path d="M80 142 Q42 111 28 132 Q48 155 80 142" fill="#9cac8b"/><path d="M80 117 Q115 83 133 102 Q120 127 80 117" fill="#aeb99a"/>
 <g transform="translate(78 58)"><ellipse cy="-25" rx="15" ry="27" fill="#d8a0a8"/><ellipse cy="-25" rx="15" ry="27" fill="#e8b9bd" transform="rotate(60)"/><ellipse cy="-25" rx="15" ry="27" fill="#d8a0a8" transform="rotate(120)"/><ellipse cy="-25" rx="15" ry="27" fill="#e8b9bd" transform="rotate(180)"/><ellipse cy="-25" rx="15" ry="27" fill="#d8a0a8" transform="rotate(240)"/><ellipse cy="-25" rx="15" ry="27" fill="#e8b9bd" transform="rotate(300)"/><circle r="10" fill="#d9b878"/></g>
</svg>
<svg class="flower bottom" viewBox="0 0 160 190" aria-hidden="true">
 <path d="M80 184 Q75 126 84 65" fill="none" stroke="#71866a" stroke-width="3"/><path d="M78 147 Q38 117 25 140 Q48 160 78 147" fill="#9cac8b"/><path d="M81 119 Q119 89 137 109 Q119 132 81 119" fill="#aeb99a"/>
 <g transform="translate(84 57)"><ellipse cy="-25" rx="15" ry="27" fill="#e5c6a4"/><ellipse cy="-25" rx="15" ry="27" fill="#f0d8bd" transform="rotate(60)"/><ellipse cy="-25" rx="15" ry="27" fill="#e5c6a4" transform="rotate(120)"/><ellipse cy="-25" rx="15" ry="27" fill="#f0d8bd" transform="rotate(180)"/><ellipse cy="-25" rx="15" ry="27" fill="#e5c6a4" transform="rotate(240)"/><ellipse cy="-25" rx="15" ry="27" fill="#f0d8bd" transform="rotate(300)"/><circle r="10" fill="#c99e60"/></g>
</svg>
<svg class="sprig left" viewBox="0 0 70 130" aria-hidden="true"><path d="M8 125 Q30 65 59 8" fill="none" stroke="#71866a" stroke-width="2"/><g fill="#9cac8b"><ellipse cx="21" cy="87" rx="8" ry="21" transform="rotate(-45 21 87)"/><ellipse cx="36" cy="63" rx="8" ry="21" transform="rotate(38 36 63)"/><ellipse cx="42" cy="39" rx="7" ry="18" transform="rotate(-38 42 39)"/></g></svg>
<svg class="sprig right" viewBox="0 0 70 130" aria-hidden="true"><path d="M8 125 Q30 65 59 8" fill="none" stroke="#71866a" stroke-width="2"/><g fill="#9cac8b"><ellipse cx="21" cy="87" rx="8" ry="21" transform="rotate(-45 21 87)"/><ellipse cx="36" cy="63" rx="8" ry="21" transform="rotate(38 36 63)"/><ellipse cx="42" cy="39" rx="7" ry="18" transform="rotate(-38 42 39)"/></g></svg>
<main>
  <div class="eyebrow">a little note for you</div>
  <h1>I'm sorry, <em>Reeba.</em></h1>
  <div class="rule"></div>
  <p class="message">Ab toh naaraaz na raahein aap.</p>
  <p class="small">Itne dil se mana raha hu maan bhi jao ab please 😭 .</p>
  <button id="btn" type="button">A tiny flower for you</button>
  <div id="note" aria-live="polite">🌼واریاہ شکریہ، عالی جاہ </div>
</main>
<script>
  const button = document.getElementById('btn');
  const note = document.getElementById('note');
  button.addEventListener('click', () => { note.classList.add('show'); button.textContent = 'For you, Reeba'; });
</script>
</body>
</html>
